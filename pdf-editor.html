<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Online PDF Editor - ToolsHub</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF.js for rendering PDF pages -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- PDF-lib for modifying and saving PDFs -->
    <script src="https://unpkg.com/pdf-lib@1.4.0/dist/pdf-lib.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">

    <!-- Header -->
    <header class="bg-indigo-600 text-white py-4 shadow-md">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">ToolsHub - PDF Editor</h1>
            <a href="index.html" class="text-sm bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded transition">Home</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 max-w-4xl">
        <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
            <h2 class="text-2xl font-semibold text-gray-800 mb-4">Apni PDF File Upload Karein</h2>
            <input type="file" id="pdfUpload" accept="application/pdf" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
            <p id="statusText" class="text-xs text-gray-500 mt-2">Koi bhi PDF file select karein...</p>
        </div>

        <!-- Editor Workspace -->
        <div id="editorSection" class="bg-white rounded-xl shadow-lg p-6 hidden">
            <div class="flex flex-wrap justify-between items-center mb-4 gap-4 border-b pb-4">
                <div class="flex items-center space-x-2">
                    <label for="textInput" class="text-sm font-medium text-gray-700">Likhnay wala Text:</label>
                    <input type="text" id="textInput" value="Edited text here" class="border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="flex items-center space-x-2">
                    <label for="pageSelect" class="text-sm font-medium text-gray-700">Page:</label>
                    <select id="pageSelect" class="border border-gray-300 rounded px-2 py-1.5 text-sm"></select>
                </div>
                <button id="savePdfBtn" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded text-sm font-medium shadow transition">Download Modified PDF</button>
            </div>

            <p class="text-xs text-gray-500 mb-2">💡 Tips: Neeche PDF ke page par jahan click karenge, wahan upar likha hua text print ho jayega.</p>

            <!-- Canvas Container -->
            <div class="relative border border-gray-200 inline-block shadow-inner overflow-auto max-h-[700px] w-full flex justify-center bg-gray-100 p-4">
                <canvas id="pdfCanvas" class="shadow-md cursor-crosshair bg-white"></canvas>
            </div>
        </div>
    </main>

    <!-- Script to handle PDF logic -->
    <script>
        let loadedPdfBytes = null;
        let pdfDoc = null;
        let pageNum = 1;
        let scale = 1.5;
        let canvas = document.getElementById('pdfCanvas');
        let ctx = canvas.getContext('2d');
        let annotations = {};

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        document.getElementById('pdfUpload').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('statusText').innerText = "PDF load ho rahi hai, intezaar karein...";

            const reader = new FileReader();
            reader.onload = async function() {
                try {
                    loadedPdfBytes = new Uint8Array(this.result);
                    const loadingTask = pdfjsLib.getDocument(loadedPdfBytes);
                    pdfDoc = await loadingTask.promise;
                    
                    let pageSelect = document.getElementById('pageSelect');
                    pageSelect.innerHTML = '';
                    for (let i = 1; i <= pdfDoc.numPages; i++) {
                        let opt = document.createElement('option');
                        opt.value = i;
                        opt.innerText = `Page ${i} of ${pdfDoc.numPages}`;
                        pageSelect.appendChild(opt);
                    }

                    annotations = {};
                    pageNum = 1;
                    document.getElementById('editorSection').classList.remove('hidden');
                    document.getElementById('statusText').innerText = "PDF kamyabi se load ho gayi hai!";
                    renderPage(pageNum);
                } catch (error) {
                    alert("PDF load karne mein masla hua hai. Shayed file kharab ya password protected hai.");
                    console.error(error);
                }
            };
            reader.readAsArrayBuffer(file);
        });

        document.getElementById('pageSelect').addEventListener('change', function() {
            pageNum = parseInt(this.value);
            renderPage(pageNum);
        });

        async function renderPage(num) {
            const page = await pdfDoc.getPage(num);
            const viewport = page.getViewport({ scale: scale });
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            const renderContext = {
                canvasContext: ctx,
                viewport: viewport
            };
            await page.render(renderContext).promise;
            drawAnnotations(num);
        }

        function drawAnnotations(pNum) {
            if (annotations[pNum]) {
                annotations[pNum].forEach(item => {
                    ctx.font = '16px Arial';
                    ctx.fillStyle = 'red';
                    ctx.fillText(item.text, item.x, item.y);
                });
            }
        }

        canvas.addEventListener('click', function(event) {
            if (!pdfDoc) return;
            const rect = canvas.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            const text = document.getElementById('textInput').value;

            if (!annotations[pageNum]) {
                annotations[pageNum] = [];
            }
            annotations[pageNum].push({ text, x, y });
            renderPage(pageNum);
        });

        document.getElementById('savePdfBtn').addEventListener('click', async function() {
            if (!loadedPdfBytes) return;

            try {
                const { PDFDocument, rgb } = PDFLib;
                const pdfDocLib = await PDFDocument.load(loadedPdfBytes);
                const pages = pdfDocLib.getPages();

                for (let pNum in annotations) {
                    const pageIndex = parseInt(pNum) - 1;
                    const page = pages[pageIndex];
                    const { height } = page.getSize();

                    annotations[pNum].forEach(item => {
                        const pdfX = item.x / scale;
                        const pdfY = height - (item.y / scale);

                        page.drawText(item.text, {
                            x: pdfX,
                            y: pdfY,
                            size: 14,
                            color: rgb(1, 0, 0),
                        });
                    });
                }

                const modifiedPdfBytes = await pdfDocLib.save();
                const blob = new Blob([modifiedPdfBytes], { type: 'application/pdf' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'edited-document.pdf';
                link.click();
            } catch (err) {
                alert("PDF save karne mein error aaya hai.");
                console.error(err);
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Online PDF Editor - ToolsHub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF-lib for easy and direct PDF manipulation -->
    <script src="https://unpkg.com/pdf-lib@1.4.0/dist/pdf-lib.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">

    <!-- Header -->
    <header class="bg-indigo-600 text-white py-4 shadow-md">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">ToolsHub - PDF Editor</h1>
            <a href="index.html" class="text-sm bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded transition">Home</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 max-w-xl">
        <div class="bg-white rounded-xl shadow-lg p-6">
            <h2 class="text-2xl font-semibold text-gray-800 mb-4">PDF Text Adder Tool</h2>
            <p class="text-sm text-gray-600 mb-4">Apni PDF file select karein aur jo text aapko add karna hai wo niche likhein.</p>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Add Honay Wala Text:</label>
                <input type="text" id="textInput" value="Verified / Signed" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">PDF File Select Karein:</label>
                <input type="file" id="pdfUpload" accept="application/pdf" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
            </div>

            <button id="processBtn" class="w-full bg-green-600 hover:bg-green-700 text-white py-2.5 rounded font-medium shadow transition hidden">PDF Me Text Add Karke Download Karein</button>
            <p id="statusText" class="text-xs text-center text-gray-500 mt-3"></p>
        </div>
    </main>

    <!-- Script -->
    <script>
        let selectedFileBytes = null;

        document.getElementById('pdfUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('statusText').innerText = "File read ho rahi hai...";
            const reader = new FileReader();
            reader.onload = function() {
                selectedFileBytes = new Uint8Array(this.result);
                document.getElementById('processBtn').classList.remove('hidden');
                document.getElementById('statusText').innerText = "File tayar hai! Neeche green button dabayein.";
            };
            reader.readAsArrayBuffer(file);
        });

        document.getElementById('processBtn').addEventListener('click', async function() {
            if (!selectedFileBytes) return;

            try {
                document.getElementById('statusText').innerText = "Processing ho rahi hai...";
                const { PDFDocument, rgb } = PDFLib;
                
                // Load the PDF
                const pdfDoc = await PDFDocument.load(selectedFileBytes);
                const textToAdd = document.getElementById('textInput').value;

                // Get the first page (or all pages) and add text at the top-left or custom position
                const pages = pdfDoc.getPages();
                const firstPage = pages[0];
                const { width, height } = firstPage.getSize();

                firstPage.drawText(textToAdd, {
                    x: 50,
                    y: height - 50, // Top margin
                    size: 16,
                    color: rgb(1, 0, 0), // Red color
                });

                // Save and trigger download
                const pdfBytes = await pdfDoc.save();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'updated-document.pdf';
                link.click();

                document.getElementById('statusText').innerText = "Kamyabi se download ho gayi hai!";
            } catch (error) {
                alert("Error: PDF file load ya modify karne mein masla hua.");
                console.error(error);
                document.getElementById('statusText').innerText = "";
            }
        });
    </script>
</body>
</html>

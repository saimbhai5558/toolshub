<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToolsHub - Home Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Header -->
    <header class="bg-indigo-600 text-white py-6 shadow-md text-center">
        <h1 class="text-3xl font-bold">Welcome to ToolsHub</h1>
        <p class="text-sm mt-1">Yahan aapko tamam free online tools milenge</p>
    </header>

    <!-- Categories & Tools Section -->
    <main class="container mx-auto px-4 py-8 max-w-4xl">
        <h2 class="text-2xl font-semibold text-gray-800 mb-6">Categories & Tools</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- PDF Tools Category -->
            <div class="bg-white p-6 rounded-xl shadow-md border border-gray-200">
                <h3 class="text-xl font-bold text-indigo-600 mb-2">📄 PDF Tools</h3>
                <p class="text-gray-600 text-sm mb-4">Apni PDF files ko edit aur manage karein.</p>
                <a href="pdf-editor.html" class="inline-block bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded text-sm font-medium transition">Open PDF Editor</a>
            </div>

            <!-- Future Categories can be added here -->
            <div class="bg-white p-6 rounded-xl shadow-md border border-gray-200">
                <h3 class="text-xl font-bold text-indigo-600 mb-2">🛠️ Other Tools</h3>
                <p class="text-gray-600 text-sm mb-4">Mazeed naye tools jald aa rahe hain.</p>
                <span class="text-gray-400 text-sm">Coming Soon</span>
            </div>
        </div>
    </main>
</body>
</html>

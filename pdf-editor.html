<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Style PDF Editor - ToolsHub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- PDF-lib -->
    <script src="https://unpkg.com/pdf-lib@1.4.0/dist/pdf-lib.min.js"></script>
    <style>
        .excel-ribbon-tab { padding: 4px 12px; cursor: pointer; border-bottom: 2px solid transparent; }
        .excel-ribbon-tab.active { border-bottom: 2px solid #107c41; color: #107c41; font-weight: bold; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans select-none flex flex-col">

    <!-- Excel Title & Top Bar -->
    <div class="bg-[#107c41] text-white px-3 py-1.5 flex justify-between items-center text-xs shadow">
        <div class="flex items-center space-x-3">
            <span class="font-bold text-sm">🟢 Excel PDF Studio</span>
            <span class="bg-[#0b5c2f] px-2 py-0.5 rounded text-[11px]">Book1 - Excel</span>
        </div>
        <div>
            <a href="index.html" class="bg-white/20 hover:bg-white/30 px-3 py-1 rounded transition">Home</a>
        </div>
    </div>

    <!-- Excel Ribbon Menu -->
    <div class="bg-white border-b border-gray-300 shadow-sm">
        <!-- Tabs Header -->
        <div class="flex px-3 text-xs font-medium text-gray-700 space-x-1 border-b border-gray-200 bg-gray-50 overflow-x-auto">
            <div class="excel-ribbon-tab">File</div>
            <div class="excel-ribbon-tab active">Home</div>
            <div class="excel-ribbon-tab">Insert</div>
            <div class="excel-ribbon-tab">Draw</div>
            <div class="excel-ribbon-tab">Page Layout</div>
            <div class="excel-ribbon-tab">Formulas</div>
            <div class="excel-ribbon-tab">Data</div>
            <div class="excel-ribbon-tab">Review</div>
            <div class="excel-ribbon-tab">View</div>
            <div class="excel-ribbon-tab">Automate</div>
            <div class="excel-ribbon-tab">Developer</div>
            <div class="excel-ribbon-tab">Help</div>
        </div>

        <!-- Ribbon Toolbar Controls (Home Tab) -->
        <div class="p-2 bg-gray-100 flex flex-wrap items-center gap-3 text-xs border-b border-gray-300">
            <!-- Clipboard / Undo Redo -->
            <div class="flex items-center space-x-1 border-r pr-3 border-gray-300">
                <button id="undoBtn" class="px-2 py-1 hover:bg-gray-200 rounded flex flex-col items-center text-[10px]" title="Undo">
                    <span class="text-sm font-bold leading-none">↩</span> Undo
                </button>
                <button id="redoBtn" class="px-2 py-1 hover:bg-gray-200 rounded flex flex-col items-center text-[10px]" title="Redo">
                    <span class="text-sm font-bold leading-none">↪</span> Redo
                </button>
            </div>

            <!-- Font Formatting -->
            <div class="flex items-center space-x-2 border-r pr-3 border-gray-300">
                <select id="fontFamily" class="border border-gray-300 rounded px-2 py-1 text-xs bg-white">
                    <option value="Helvetica">Aptos Narrow</option>
                    <option value="Helvetica">Helvetica</option>
                    <option value="Times-Roman">Times New Roman</option>
                    <option value="Courier">Courier New</option>
                </select>
                <select id="fontSize" class="border border-gray-300 rounded px-1 py-1 text-xs bg-white w-14 text-center">
                    <option value="10">10</option>
                    <option value="12" selected>12</option>
                    <option value="14">14</option>
                    <option value="16">16</option>
                    <option value="18">18</option>
                    <option value="24">24</option>
                </select>
                <input type="color" id="textColor" value="#000000" class="h-6 w-6 border border-gray-300 rounded cursor-pointer p-0 bg-white" title="Text Color">
            </div>

            <!-- Text & Navigation -->
            <div class="flex items-center space-x-2 border-r pr-3 border-gray-300">
                <input type="text" id="textInput" placeholder="Yahan text likhein..." class="border border-gray-300 rounded px-2 py-1 text-xs focus:outline-none focus:ring-1 focus:ring-[#107c41] w-40 bg-white">
                <select id="pageSelect" class="border border-gray-300 rounded px-2 py-1 text-xs bg-white"></select>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center gap-2 ml-auto">
                <button id="clearBtn" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-xs font-semibold shadow transition">Clear Page</button>
                <button id="savePdfBtn" class="bg-[#107c41] hover:bg-[#0b5c2f] text-white px-4 py-1 rounded text-xs font-semibold shadow transition flex items-center gap-1">📥 Download PDF</button>
            </div>
        </div>
    </div>

    <!-- Main Workspace -->
    <main class="flex-grow container mx-auto px-4 py-4 max-w-6xl flex flex-col">
        <!-- Upload Box -->
        <div id="uploadSection" class="bg-white rounded-lg shadow p-6 mb-4 text-center border border-gray-300">
            <h2 class="text-base font-semibold text-gray-800 mb-2">Apni PDF File Upload Karein</h2>
            <input type="file" id="pdfUpload" accept="application/pdf" class="block mx-auto text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-green-50 file:text-[#107c41] hover:file:bg-green-100 cursor-pointer">
        </div>

        <!-- Canvas Container with Proper Responsive Fit -->
        <div id="editorSection" class="relative bg-white border border-gray-300 shadow-md rounded-lg overflow-auto flex-grow flex justify-center p-4 hidden min-h-[600px]">
            <canvas id="pdfCanvas" class="shadow-lg cursor-crosshair bg-white"></canvas>
        </div>
    </main>

    <!-- Script Logic -->
    <script>
        let loadedPdfBytes = null;
        let pdfDoc = null;
        let pageNum = 1;
        let scale = 1.25; // Adjusted scale for clear viewing
        let canvas = document.getElementById('pdfCanvas');
        let ctx = canvas.getContext('2d');
        let annotations = {};
        let redoStack = {};

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        document.getElementById('pdfUpload').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function() {
                try {
                    loadedPdfBytes = new Uint8Array(this.result);
                    const loadingTask = pdfjsLib.getDocument(loadedPdfBytes);
                    pdfDoc = await loadingTask.promise;
                    
                    let pageSelect = document.getElementById('pageSelect');
                    pageSelect.innerHTML = '';
                    for (let i = 1; i <= pdfDoc.numPages; i++) {
                        let opt = document.createElement('option');
                        opt.value = i;
                        opt.innerText = `Page ${i} of ${pdfDoc.numPages}`;
                        pageSelect.appendChild(opt);
                    }

                    annotations = {};
                    redoStack = {};
                    pageNum = 1;
                    document.getElementById('editorSection').classList.remove('hidden');
                    renderPage(pageNum);
                } catch (err) {
                    alert("PDF load karne mein error aaya hai.");
                    console.error(err);
                }
            };
            reader.readAsArrayBuffer(file);
        });

        document.getElementById('pageSelect').addEventListener('change', function() {
            pageNum = parseInt(this.value);
            renderPage(pageNum);
        });

        async function renderPage(num) {
            const page = await pdfDoc.getPage(num);
            const viewport = page.getViewport({ scale: scale });
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            const renderContext = {
                canvasContext: ctx,
                viewport: viewport
            };
            await page.render(renderContext).promise;
            drawAnnotations(num);
        }

        function drawAnnotations(pNum) {
            if (annotations[pNum]) {
                annotations[pNum].forEach(item => {
                    ctx.font = `${item.size * scale}px ${item.fontFamily}`;
                    ctx.fillStyle = item.color;
                    ctx.fillText(item.text, item.x, item.y);
                });
            }
        }

        canvas.addEventListener('click', function(event) {
            if (!pdfDoc) return;
            const rect = canvas.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            const text = document.getElementById('textInput').value || "Sample Text";
            const size = parseInt(document.getElementById('fontSize').value);
            const color = document.getElementById('textColor').value;
            const fontFamily = document.getElementById('fontFamily').value;

            if (!annotations[pageNum]) {
                annotations[pageNum] = [];
            }
            annotations[pageNum].push({ text, x, y, size, color, fontFamily });
            
            if (!redoStack[pageNum]) redoStack[pageNum] = [];
            redoStack[pageNum] = [];

            renderPage(pageNum);
        });

        document.getElementById('undoBtn').addEventListener('click', function() {
            if (annotations[pageNum] && annotations[pageNum].length > 0) {
                if (!redoStack[pageNum]) redoStack[pageNum] = [];
                let removed = annotations[pageNum].pop();
                redoStack[pageNum].push(removed);
                renderPage(pageNum);
            }
        });

        document.getElementById('redoBtn').addEventListener('click', function() {
            if (redoStack[pageNum] && redoStack[pageNum].length > 0) {
                if (!annotations[pageNum]) annotations[pageNum] = [];
                let restored = redoStack[pageNum].pop();
                annotations[pageNum].push(restored);
                renderPage(pageNum);
            }
        });

        document.getElementById('clearBtn').addEventListener('click', function() {
            if (annotations[pageNum]) {
                annotations[pageNum] = [];
                redoStack[pageNum] = [];
                renderPage(pageNum);
            }
        });

        document.getElementById('savePdfBtn').addEventListener('click', async function() {
            if (!loadedPdfBytes) {
                alert("Pehle koi PDF file upload karein!");
                return;
            }

            try {
                const { PDFDocument, rgb, StandardFonts } = PDFLib;
                const pdfDocLib = await PDFDocument.load(loadedPdfBytes);
                const pages = pdfDocLib.getPages();
                const defaultFont = await pdfDocLib.embedFont(StandardFonts.Helvetica);

                for (let pNum in annotations) {
                    const pageIndex = parseInt(pNum) - 1;
                    if (pageIndex >= pages.length) continue;
                    const page = pages[pageIndex];
                    const { width, height } = page.getSize();
                    const currentViewport = page.getViewport({ scale: scale });

                    annotations[pNum].forEach(item => {
                        const pdfX = (item.x / currentViewport.width) * width;
                        const pdfY = height - ((item.y / currentViewport.height) * height);

                        let hex = item.color.replace('#', '');
                        let r = parseInt(hex.substring(0, 2), 16) / 255;
                        let g = parseInt(hex.substring(2, 4), 16) / 255;
                        let b = parseInt(hex.substring(4, 6), 16) / 255;

                        page.drawText(item.text, {
                            x: pdfX,
                            y: pdfY,
                            size: item.size,
                            font: defaultFont,
                            color: rgb(r, g, b),
                        });
                    });
                }

                const modifiedPdfBytes = await pdfDocLib.save();
                const blob = new Blob([modifiedPdfBytes], { type: 'application/pdf' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'edited-document.pdf';
                link.click();
            } catch (err) {
                alert("PDF save karne mein error aaya hai.");
                console.error(err);
            }
        });
    </script>
</body>
</html>
